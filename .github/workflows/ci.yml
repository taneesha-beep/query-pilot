name: ci

on:
  push:
    branches: [main]
  pull_request:

# No secrets are used anywhere in this workflow. The test suite makes no live
# API calls and must pass with no keys present.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Pinned to an exact version: setup-uv publishes floating major tags only up to
      # v7, so astral-sh/setup-uv@v10 does not resolve and fails the run before any step.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest
