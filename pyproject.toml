[project]
name = "query-pilot"
version = "0.1.0"
description = "An agent that answers natural-language questions against relational databases, verified by execution."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Taneesha Badhe" }]
dependencies = [
    "httpx>=0.28.1",
]

[project.optional-dependencies]
mcp = [
    "mcp==2.2.0",
]
api = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "mcp==2.2.0",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/query_pilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
